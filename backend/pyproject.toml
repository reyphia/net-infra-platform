[project]
name = "net-infrastructure-platform"
version = "0.1.0"
description = "Network infrastructure discovery, topology, and controlled-change management platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "asyncssh>=2.14.2",
    # Pinned: pysnmp>=7.0 (the "pysnmp" PyPI package, formerly pysnmp-lextudio)
    # ships hlapi.v3arch.asyncio code that imports pyasn1.compat.octets and
    # references pysnmp.entity.config.USM_AUTH_NONE, neither of which exist
    # in that release combination -- confirmed by direct testing, not
    # assumed. 6.1.4 + pyasn1<0.5.0 is the last combination whose
    # hlapi.asyncio (getCmd/bulkCmd) actually imports and runs real GET/WALK
    # requests. See docs/discovery.md for details.
    "pysnmp==6.1.4",
    "pyasn1<0.5.0",
    "cryptography>=42.0.0",
    "scapy>=2.5.0",
    "icmplib>=3.0.4",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]
ignore = [
    "E501",
    "B008",   # FastAPI's Depends()/Query() pattern intentionally calls functions in argument defaults
    "UP042",  # (str, Enum) kept over StrEnum for broader SQLAlchemy/Pydantic compatibility across versions
    "ASYNC109", # our own timeout=/connect_timeout= kwargs are app-level, not a reason to restructure as asyncio.timeout
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["tests/", "alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
